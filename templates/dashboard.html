<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="../shell.css">
    <title>JARVIS // Core HUD</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #030a12;
            color: #5ce1e6;
            overflow: hidden;
        }
        .glow { text-shadow: 0 0 10px #5ce1e6, 0 0 20px #00c8ff; }
        .border-glow { box-shadow: 0 0 15px rgba(92, 225, 230, 0.2); border-color: #5ce1e6; }
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            opacity: 0.6;
            pointer-events: none;
            background-size: 100% 4px, 6px 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function JarvisDashboard() {
            const [command, setCommand] = React.useState("");
            const [logs, setLogs] = React.useState([
                "SYSTEM BOOT: DEPLOYING CORE LAYER...",
                "MEMORY DATABASE: CHROMADB INSTANTIATED.",
                "HARDWARE ACCESS: ACTIVE CONNECTIVITY SECURED.",
                "JARVIS IS READY. AWAITING INSTRUCTIONS..."
            ]);
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [telemetry, setTelemetry] = React.useState({ cpu: 0, ram: 0, disk: 0, temp: 0 });

            React.useEffect(() => {
                const fetchStats = async () => {
                    try {
                        const res = await fetch('/api/telemetry');
                        const data = await res.json();
                        if (data.status === "nominal") setTelemetry(data);
                    } catch (err) { console.error("Telemetry link offline"); }
                };
                fetchStats();
                const interval = setInterval(fetchStats, 2000);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                const fetchHistory = async () => {
                    try {
                        const token = localStorage.getItem("jarvis_session") || localStorage.getItem("jarvis_token");
                        if (!token) return;
                        const res = await fetch('/api/history', {
                            headers: {
                                'X-JARVIS-TOKEN': token,
                                'Authorization': `Bearer ${token}`
                            }
                        });
                        const data = await res.json();
                        if (data.status === "nominal" && data.history.length > 0) {
                            const formattedLogs = data.history.map(
                                item => `[${item.timestamp}] ${item.sender}: ${item.message}`
                            );
                            setLogs(formattedLogs);
                        }
                    } catch (err) { console.error("History pipeline unreachable."); }
                };
                fetchHistory();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!command.trim()) return;

                let storedToken = localStorage.getItem("jarvis_session") || localStorage.getItem("jarvis_token");
                if (!storedToken) {
                    storedToken = prompt("ENTER JARVIS ACCESS SECURITY MATRIX TOKEN OVERRIDE CODE:");
                    if (storedToken) localStorage.setItem("jarvis_token", storedToken);
                    else return;
                }

                const userPrompt = command;
                setCommand("");
                setIsProcessing(true);
                setLogs(prev => [...prev, `USER: ${userPrompt}`]);

                try {
                    const response = await fetch('/api/jarvis', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': storedToken ? `Bearer ${storedToken}` : '',
                            'X-JARVIS-TOKEN': storedToken
                        },
                        body: JSON.stringify({ prompt: userPrompt })
                    });

                    if (response.status === 403) {
                        setLogs(prev => [...prev, "SYSTEM ERROR: ACCESS DENIED. WRONG TOKEN SIGNATURE."]);
                        localStorage.removeItem("jarvis_token");
                        return;
                    }

                    const data = await response.json();
                    setLogs(prev => [...prev, `JARVIS: ${data.reply}`]);
                } catch (err) {
                    setLogs(prev => [...prev, "SYSTEM ERROR: LINK TERMINATION OR OFFLINE AGENT EXCEPTION."]);
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="h-screen w-screen p-6 flex flex-col justify-between relative">
                    <div className="flex justify-between items-center border-b border-[#5ce1e6] pb-4 border-opacity-40">
                        <div>
                            <h1 className="text-3xl font-bold tracking-widest glow">JARVIS // CORE OPERATING SYSTEM</h1>
                            <p className="text-xs text-cyan-500 opacity-70">MATRIX CONFIG: STATUS_ACTIVE</p>
                        </div>
                        <div className="text-right">
                            <div className="text-xl glow">SYSTEM STATUS: ONLINE</div>
                            <div className="text-xs text-emerald-400">ALL SUBSYSTEMS NOMINAL</div>
                        </div>
                    </div>

                    <div className="flex-1 my-6 grid grid-cols-4 gap-6 overflow-hidden">
                        <div className="col-span-1 flex flex-col space-y-4">
                            <div className="bg-[#061320] bg-opacity-60 border border-[#5ce1e6] border-opacity-30 p-4 rounded border-glow flex flex-col justify-around h-full">
                                <div className="text-xs border-b border-[#5ce1e6] border-opacity-20 pb-1 mb-2 text-cyan-400 uppercase tracking-wider">&gt; Matrix Diagnostic Core</div>
                                <div className="space-y-3">
                                    <div>
                                        <div className="flex justify-between text-xs mb-1"><span>CPU LOAD</span><span className="text-amber-400 font-bold">{telemetry.cpu}%</span></div>
                                        <div className="w-full bg-cyan-950 h-1.5 rounded overflow-hidden"><div className="bg-[#5ce1e6] h-full transition-all duration-500" style={{width: `${telemetry.cpu}%`}}></div></div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs mb-1"><span>RAM ALLOCATION</span><span className="text-amber-400 font-bold">{telemetry.ram}%</span></div>
                                        <div className="w-full bg-cyan-950 h-1.5 rounded overflow-hidden"><div className="bg-[#5ce1e6] h-full transition-all duration-500" style={{width: `${telemetry.ram}%`}}></div></div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs mb-1"><span>DISK USAGE</span><span className="text-amber-400 font-bold">{telemetry.disk}%</span></div>
                                        <div className="w-full bg-cyan-950 h-1.5 rounded overflow-hidden"><div className="bg-[#5ce1e6] h-full transition-all duration-500" style={{width: `${telemetry.disk}%`}}></div></div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs mb-1"><span>CORE TEMP</span><span className={telemetry.temp > 75 ? 'text-red-500 font-bold' : 'text-emerald-400 font-bold'}>{telemetry.temp}&deg;C</span></div>
                                        <div className="w-full bg-cyan-950 h-1.5 rounded overflow-hidden"><div className="bg-emerald-400 h-full transition-all duration-500" style={{width: `${Math.min(telemetry.temp, 100)}%`}}></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="col-span-2 bg-[#061320] bg-opacity-60 border border-[#5ce1e6] border-opacity-30 p-4 flex flex-col rounded border-glow">
                            <div className="text-xs border-b border-[#5ce1e6] border-opacity-20 pb-2 mb-2 text-cyan-400 uppercase tracking-wider">&gt; Direct Terminal Stream Logs</div>
                            <div className="flex-1 overflow-y-auto space-y-2 text-sm pr-2 text-cyan-200">
                                {logs.map((log, idx) => (
                                    <div key={idx} className={log.includes('USER:') ? 'text-amber-400' : log.includes('JARVIS:') ? 'text-cyan-300 font-bold' : 'opacity-80'}>
                                        {log}
                                    </div>
                                ))}
                                {isProcessing && <div className="text-cyan-400 animate-pulse font-bold">&gt; JARVIS IS COMPUTING WORKING STATE...</div>}
                            </div>
                        </div>

                        <div className="col-span-1 bg-[#061320] bg-opacity-60 border border-[#5ce1e6] border-opacity-30 p-4 flex flex-col items-center justify-center rounded text-center border-glow relative">
                            <div className="absolute top-4 left-4 text-xs text-cyan-400 uppercase tracking-wider">&gt; Audio Diagnostic Matrix</div>
                            <div className={`w-28 h-28 rounded-full border-4 border-dashed border-[#5ce1e6] border-opacity-60 flex items-center justify-center ${isProcessing ? 'animate-spin' : 'animate-[spin_20s_linear_infinite]'}`}>
                                <div className="w-16 h-16 rounded-full border border-double border-cyan-400 opacity-60"></div>
                            </div>
                            <div className="mt-4">
                                <div className="text-sm tracking-wider text-cyan-300 uppercase">{isProcessing ? "Transmitting" : "Synced"}</div>
                                <p className="text-xs opacity-60 mt-1">Telegram voice bridge active</p>
                            </div>
                        </div>
                    </div>

                    <form onSubmit={handleSubmit} className="relative bg-[#061320] bg-opacity-80 border border-[#5ce1e6] border-opacity-40 p-2 rounded flex items-center border-glow">
                        <span className="text-xl px-3 text-cyan-400 font-bold animate-pulse">&gt;</span>
                        <input
                            type="text"
                            value={command}
                            onChange={(e) => setCommand(e.target.value)}
                            placeholder="Enter orchestration prompt..."
                            className="bg-transparent flex-1 text-[#5ce1e6] placeholder-cyan-700 outline-none text-lg py-2 tracking-wide font-mono"
                            disabled={isProcessing}
                        />
                        <button
                            type="submit"
                            className="bg-[#122e47] hover:bg-cyan-500 hover:text-[#030a12] text-[#5ce1e6] border border-[#5ce1e6] px-6 py-2 rounded transition-all text-sm tracking-widest font-bold"
                            disabled={isProcessing}
                        >
                            EXECUTE
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<JarvisDashboard />);
    </script>
    <script src="../nav.js" defer></script>
</body>
</html>
